name: Flutter Web Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [implement-approved-plan, main]
  workflow_dispatch:

jobs:
  analyze-and-build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build web
        continue-on-error: true
        run: flutter build web --release 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-check-logs
          path: |
            analyze.log
            build.log

      - name: Fail if analyze failed
        run: test ! -s analyze.log || ! grep -E "error •|[0-9]+ issues? found" analyze.log

      - name: Fail if build failed
        run: test ! -s build.log || ! grep -E "Error:|FAILURE|Exception" build.log
