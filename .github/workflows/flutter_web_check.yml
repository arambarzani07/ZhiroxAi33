name: Flutter Web Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [implement-approved-plan, main]

jobs:
  analyze-and-build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release --dart-define=POCKETBASE_URL=${{ secrets.POCKETBASE_URL }}
