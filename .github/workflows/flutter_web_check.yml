name: Flutter Web Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [implement-approved-plan, main]
  workflow_dispatch:

jobs:
  analyze-and-build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web
        run: flutter build web --release
